name: Build Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build OTF package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontforge \
            make \
            python3 \
            python3-fonttools \
            python3-venv \
            unzip \
            zip
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: make PYTHON=.venv/bin/python test

      - name: Build distribution
        run: make PYTHON=.venv/bin/python distribution

      - name: Verify distribution
        run: |
          test "$(find instance_otf -maxdepth 1 -name 'SNUEdge-*.otf' | wc -l)" -eq 16
          test "$(find dist -maxdepth 1 -name 'SNUEdge-*.zip' | wc -l)" -eq 1
          package="$(find dist -maxdepth 1 -name 'SNUEdge-*.zip' -print -quit)"
          test "$(unzip -Z1 "${package}" | grep -Ec '^[^/]+$')" -eq 19
          test -z "$(unzip -Z1 "${package}" | grep -Ev '^(SNUEdge-[A-Za-z]+\.otf|LICENSE(-(Montserrat|NanumSquare))?\.txt)$')"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SNUEdge-${{ github.sha }}
          path: dist/SNUEdge-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: SNUEdge-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            dist/SNUEdge-*.zip \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTE.md \
            --verify-tag
